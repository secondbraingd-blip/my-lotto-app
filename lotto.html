<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로또 번호 추첨기</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #21252e;
    --border: #2c313c;
    --text: #eef0f4;
    --sub: #8b90a0;
    --accent: #ffcc33;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }

  .board {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .label {
    font-size: 0.8rem;
    color: var(--sub);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .balls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    margin-bottom: 22px;
    padding-top: 6px;
  }

  .bonus-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
  }

  .ball {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), 0 6px 10px rgba(0,0,0,0.4);
    opacity: 0;
    animation: fall 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes fall {
    0%   { opacity: 0; transform: translateY(-200px) scale(0.7) rotate(-25deg); }
    55%  { opacity: 1; transform: translateY(0)      scale(1.08) rotate(8deg); }
    70%  { transform: translateY(-16px) scale(0.96) rotate(-4deg); }
    85%  { transform: translateY(0)     scale(1.03) rotate(2deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  .ball.bonus {
    outline: 2px dashed rgba(255,255,255,0.55);
    outline-offset: 3px;
  }

  button {
    font-family: inherit;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-row button {
    flex: 1;
    min-width: 130px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 1.02rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: -0.02em;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  #drawBtn {
    background: linear-gradient(135deg, var(--accent), #ff9f43);
    color: #1a1a1a;
    box-shadow: 0 6px 16px rgba(255, 204, 51, 0.25);
  }

  #autoBtn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  #autoBtn.active {
    background: linear-gradient(135deg, #ff5b5b, #ff8a5b);
    color: #fff;
  }

  .btn-row button:active {
    transform: scale(0.97);
  }

  .auto-status {
    text-align: center;
    font-size: 0.78rem;
    color: var(--sub);
    margin: 10px 0 0;
    min-height: 1em;
  }

  .auto-status.on {
    color: #ff8a5b;
    font-weight: 600;
  }

  .history {
    margin-top: 30px;
  }

  .history h2, .prob-section h2 {
    font-size: 0.95rem;
    color: var(--sub);
    font-weight: 600;
    margin: 0 0 12px;
    padding-left: 4px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .history-item .round {
    font-size: 0.75rem;
    color: var(--sub);
    min-width: 34px;
    flex-shrink: 0;
  }

  .history-balls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .mini-ball {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .mini-ball.bonus { outline: 2px dashed rgba(255,255,255,0.5); outline-offset: 2px; }

  .empty-history {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    padding: 16px 0;
  }

  .prob-section {
    margin-top: 30px;
  }

  .prob-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    font-size: 0.82rem;
  }

  .prob-table th, .prob-table td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .prob-table th {
    color: var(--sub);
    font-weight: 600;
    font-size: 0.75rem;
  }

  .prob-table tr:last-child td {
    border-bottom: none;
  }

  .prob-table td.rank {
    font-weight: 700;
    color: var(--accent);
  }

  .prob-note {
    text-align: center;
    color: var(--sub);
    font-size: 0.72rem;
    margin-top: 8px;
  }

  @media (max-width: 360px) {
    .ball { width: 42px; height: 42px; font-size: 0.95rem; }
    .mini-ball { width: 26px; height: 26px; font-size: 0.7rem; }
    .prob-table { font-size: 0.72rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎱 로또 번호 추첨기</h1>
    <p class="subtitle">1~45 중 6개 + 보너스 번호 1개</p>

    <div class="board">
      <div class="label">이번 회차 번호</div>
      <div class="balls" id="balls"></div>

      <div class="bonus-row">
        <span class="label" style="margin:0;">보너스</span>
        <div id="bonus"></div>
      </div>

      <div class="btn-row">
        <button id="drawBtn">🎲 추첨하기</button>
        <button id="autoBtn">⏱ 자동 추첨 시작</button>
      </div>
      <p class="auto-status" id="autoStatus"></p>
    </div>

    <div class="history">
      <h2>지난 추첨 결과</h2>
      <div id="historyList">
        <div class="empty-history">아직 추첨 기록이 없어요</div>
      </div>
    </div>

    <div class="prob-section">
      <h2>당첨 확률 (로또 6/45 기준)</h2>
      <table class="prob-table">
        <thead>
          <tr><th>순위</th><th>당첨 조건</th><th>확률</th></tr>
        </thead>
        <tbody>
          <tr><td class="rank">1등</td><td>6개 번호 일치</td><td>1 / 8,145,060</td></tr>
          <tr><td class="rank">2등</td><td>5개 + 보너스 일치</td><td>1 / 1,357,510</td></tr>
          <tr><td class="rank">3등</td><td>5개 번호 일치</td><td>1 / 35,724</td></tr>
          <tr><td class="rank">4등</td><td>4개 번호 일치</td><td>1 / 733</td></tr>
          <tr><td class="rank">5등</td><td>3개 번호 일치</td><td>1 / 45</td></tr>
        </tbody>
      </table>
      <p class="prob-note">전체 조합 수: 8,145,060가지 (실제 로또 6/45 기준 확률)</p>
    </div>
  </div>

<script>
  const ballsEl = document.getElementById('balls');
  const bonusEl = document.getElementById('bonus');
  const historyList = document.getElementById('historyList');
  const drawBtn = document.getElementById('drawBtn');
  const autoBtn = document.getElementById('autoBtn');
  const autoStatus = document.getElementById('autoStatus');

  const MAX_HISTORY = 5;
  const AUTO_INTERVAL_MS = 5000;
  const RAINBOW = ['#ff4757', '#ffa502', '#f7d716', '#2ed573', '#1e90ff', '#8854d0'];

  let history = [];
  let round = 1;
  let autoTimer = null;

  function rainbowColor(idx) {
    return RAINBOW[idx % RAINBOW.length];
  }

  function drawNumbers() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const main = pool.slice(0, 6).sort((a, b) => a - b);
    const bonus = pool[6];
    return { main, bonus };
  }

  function renderBalls(main, bonus) {
    ballsEl.innerHTML = '';
    main.forEach((n, idx) => {
      const el = document.createElement('div');
      el.className = 'ball';
      el.textContent = n;
      el.style.background = rainbowColor(idx);
      el.style.animationDelay = `${idx * 0.1}s`;
      ballsEl.appendChild(el);
    });

    bonusEl.innerHTML = '';
    const bEl = document.createElement('div');
    bEl.className = 'ball bonus';
    bEl.textContent = bonus;
    bEl.style.background = `conic-gradient(from 0deg, ${RAINBOW.join(',')}, ${RAINBOW[0]})`;
    bEl.style.animationDelay = `${main.length * 0.1}s`;
    bonusEl.appendChild(bEl);
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div class="empty-history">아직 추첨 기록이 없어요</div>';
      return;
    }
    historyList.innerHTML = history.map(item => `
      <div class="history-item">
        <span class="round">${item.round}회</span>
        <div class="history-balls">
          ${item.main.map((n, idx) => `<div class="mini-ball" style="background:${rainbowColor(idx)}">${n}</div>`).join('')}
          <div class="mini-ball bonus" style="background:conic-gradient(from 0deg, ${RAINBOW.join(',')}, ${RAINBOW[0]})">${item.bonus}</div>
        </div>
      </div>
    `).join('');
  }

  function draw() {
    const { main, bonus } = drawNumbers();
    renderBalls(main, bonus);

    history.unshift({ round, main, bonus });
    if (history.length > MAX_HISTORY) history.pop();
    round++;
    renderHistory();
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
    autoBtn.textContent = '⏱ 자동 추첨 시작';
    autoBtn.classList.remove('active');
    autoStatus.textContent = '';
    autoStatus.classList.remove('on');
  }

  function startAuto() {
    draw();
    autoTimer = setInterval(draw, AUTO_INTERVAL_MS);
    autoBtn.textContent = '⏹ 자동 추첨 중지';
    autoBtn.classList.add('active');
    autoStatus.textContent = '자동 추첨 중... (5초마다 새로 뽑아요)';
    autoStatus.classList.add('on');
  }

  drawBtn.addEventListener('click', () => {
    stopAuto();
    draw();
  });

  autoBtn.addEventListener('click', () => {
    if (autoTimer) {
      stopAuto();
    } else {
      startAuto();
    }
  });

  draw();
</script>
</body>
</html>
